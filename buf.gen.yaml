# Rust types for the schema crate, from the protobuf module: `just gen`,
# which is `buf generate` with this file.
#
# Local plugins rather than remote ones: the output is committed, so it has
# to be reproducible from a checkout, and a remote plugin's version is
# whatever the registry serves that day.
version: v2
clean: true
inputs:
  - directory: protobuf
plugins:
  # Messages and enums. Well-known types from pbjson-types: the same
  # messages as prost-types, with the canonical protobuf JSON mapping.
  - local: protoc-gen-prost
    out: crates/regalium-dmx-schema/src/generated
    opt:
      - enable_type_names
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
  # The canonical protobuf JSON mapping for every message, so a universe or
  # its levels are the same JSON wherever they are written or read.
  - local: protoc-gen-prost-serde
    out: crates/regalium-dmx-schema/src/generated
    opt:
      - extern_path=.google.protobuf=::pbjson_types
  # The module tree that includes them, so the crate's lib.rs names one file.
  - local: protoc-gen-prost-crate
    out: crates/regalium-dmx-schema/src/generated
    strategy: all
    opt:
      - no_features
