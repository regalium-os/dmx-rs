    dmx.node.v1.NodeState:
      description: What this server last saw of a node.
      enum:
      - NODE_STATE_UNSPECIFIED
      - NODE_STATE_REACHABLE
      - NODE_STATE_UNREACHABLE
      type: string
    dmx.node.v1.Port:
      description: 'One of a node''s ports: a DMX512 line, and the universe it carries.'
      properties:
