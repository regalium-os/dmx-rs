              description: How many slots it carries, 0 to 512.
              format: int32
              type: integer
            state:
              description: What it is doing now.
              enum:
              - UNIVERSE_STATE_UNSPECIFIED
              - UNIVERSE_STATE_LIVE
              - UNIVERSE_STATE_IDLE
              - UNIVERSE_STATE_FAILING
              type: string
          type: object
        updateMask:
          description: 'Fields to change: display_name, and the output''s refresh
            and priority or the input''s merge mode and source limit. Protocol, number
            and node are fixed: a different one is a different universe.'
          properties:
            paths:
              description: The set of field mask paths.
              items:
                type: string
              type: array
          type: object
      type: object
    dmx.universe.v1.WriteLevelsRequest:
      description: 'Request message for UniverseService.WriteLevels: a run of slots
        from one address, the rest unchanged.'
      properties:
        name:
          description: 'The levels to write into. Format: universes/{universe}/levels'
          type: string
        startAddress:
          description: The first slot written, 1 to 512.
          format: int32
          type: integer
        values:
          description: 'The levels, 0 to 255, for consecutive slots from start_address.
            All or nothing: a run past slot 512 is refused, and nothing is written.'
          items:
            format: int32
            type: integer
          type: array
      type: object
