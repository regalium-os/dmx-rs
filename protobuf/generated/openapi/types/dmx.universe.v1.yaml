                    format: int32
                    type: integer
                type: object
              protocol:
                description: The transport it travels on.
                enum:
                - PROTOCOL_UNSPECIFIED
                - PROTOCOL_ARTNET
                - PROTOCOL_SACN
                - PROTOCOL_SERIAL
                type: string
              slotCount:
                description: How many slots it carries, 0 to 512.
                format: int32
                type: integer
              state:
                description: What it is doing now.
                enum:
                - UNIVERSE_STATE_UNSPECIFIED
                - UNIVERSE_STATE_LIVE
                - UNIVERSE_STATE_IDLE
                - UNIVERSE_STATE_FAILING
                type: string
            type: object
          type: array
      type: object
    dmx.universe.v1.MergeMode:
      description: How a merged universe combines its sources, slot by slot, among
        those at the highest priority present.
      enum:
      - MERGE_MODE_UNSPECIFIED
      - MERGE_MODE_HTP
      - MERGE_MODE_LTP
      type: string
    dmx.universe.v1.Output:
      description: How an output universe is refreshed.
      properties:
        interval:
          description: 'The shortest time between packets: about 23 ms, 44 Hz, at
            full rate. Unset, the transport''s own.'
          type: string
        keepAlive:
          description: 'How often unchanged levels are resent. Unset, the transport''s
            own: one second on the network, every interval on a raw line.'
          type: string
        priority:
          description: 'For sACN, the priority sent with every packet: 0 to 200, 100
            unset.'
          format: int32
          type: integer
      type: object
    dmx.universe.v1.Source:
      description: One source an input is merging.
      properties:
        displayName:
          description: 'Its name, where the protocol carries one: an sACN source name.'
          type: string
        id:
          description: 'Who it is: an Art-Net sender''s address, `10.0.0.9:6454`;
            an sACN CID.'
          type: string
        lastSeenTime:
          description: When its last packet arrived.
          format: date-time
          type: string
        merged:
          description: Whether it is at the highest priority present, and so merged
            rather than held.
          type: boolean
        priority:
          description: 'Its priority: 0 to 200, 100 for Art-Net, which has none.'
          format: int32
          type: integer
      type: object
    dmx.universe.v1.StreamLevelsRequest:
      description: Request message for UniverseService.StreamLevels.
      properties:
        interval:
          description: The shortest time between two responses. Levels move at up
            to 44 Hz; a display rarely needs more than 10. Defaults to 100 ms; at
            least 25.
          type: string
        name:
          description: 'The levels to watch: an output''s or an input''s. Format:
            universes/{universe}/levels'
          type: string
      type: object
    dmx.universe.v1.StreamLevelsResponse:
      description: 'Response message for UniverseService.StreamLevels: the levels
        whenever they have changed, no more often than asked.'
      properties:
        levels:
          description: The levels as they now stand.
          properties:
            generation:
              description: A counter that moves exactly when the levels a receiver
                would see change, so a reader polling can tell a change from a repeat.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
            name:
              description: 'The levels'' name. Format: universes/{universe}/levels'
              type: string
            slots:
              description: 'The slots, one octet each, from slot 1: 0 to 512 of them.
                Their count is how many slots are sent.'
              format: byte
              type: string
            updateTime:
              description: When they last changed.
              format: date-time
              type: string
          type: object
      type: object
