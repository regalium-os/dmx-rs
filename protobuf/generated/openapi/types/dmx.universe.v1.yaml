        an input.'
      properties:
        createTime:
          description: When it was created.
          format: date-time
          type: string
        displayName:
          description: A label for people.
          type: string
        input:
          description: Received, and merged.
          properties:
            maxSources:
              description: The most sources merged at once; more are refused. Defaults
                to 8.
              format: int32
              type: integer
            mergeMode:
              description: HTP or LTP, among the sources at the highest priority present.
              enum:
              - MERGE_MODE_UNSPECIFIED
              - MERGE_MODE_HTP
              - MERGE_MODE_LTP
              type: string
            sources:
              description: The sources merged now.
              items:
                description: One source an input is merging.
                properties:
                  displayName:
                    description: 'Its name, where the protocol carries one: an sACN
                      source name.'
                    type: string
                  id:
                    description: 'Who it is: an Art-Net sender''s address, `10.0.0.9:6454`;
                      an sACN CID.'
                    type: string
                  lastSeenTime:
                    description: When its last packet arrived.
                    format: date-time
                    type: string
                  merged:
                    description: Whether it is at the highest priority present, and
                      so merged rather than held.
                    type: boolean
                  priority:
                    description: 'Its priority: 0 to 200, 100 for Art-Net, which has
                      none.'
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
        name:
          description: 'The universe''s name. Format: universes/{universe}'
          type: string
        node:
          description: 'The node it is carried by: required for a serial line, which
            is one widget''s; for Art-Net and sACN, where the network carries it,
            empty. Format: nodes/{node}'
          type: string
        number:
          description: 'The universe number, as the protocol numbers universes: an
            Art-Net Port-Address, 0 to 32767; an sACN universe, 1 to 63999; 1 on a
            serial line.'
          format: int32
          type: integer
        output:
          description: Sent, refreshed by this policy.
          properties:
            interval:
              description: 'The shortest time between packets: about 23 ms, 44 Hz,
