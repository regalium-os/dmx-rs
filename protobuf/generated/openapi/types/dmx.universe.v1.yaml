              format: int32
              type: integer
          type: object
        protocol:
          description: The transport it travels on.
          enum:
          - PROTOCOL_UNSPECIFIED
          - PROTOCOL_ARTNET
          - PROTOCOL_SACN
          - PROTOCOL_SERIAL
          type: string
        slotCount:
          description: How many slots it carries, 0 to 512.
          format: int32
          type: integer
        state:
          description: What it is doing now.
          enum:
          - UNIVERSE_STATE_UNSPECIFIED
          - UNIVERSE_STATE_LIVE
          - UNIVERSE_STATE_IDLE
          - UNIVERSE_STATE_FAILING
          type: string
      type: object
    dmx.universe.v1.UniverseState:
      description: What a universe is doing now.
      enum:
      - UNIVERSE_STATE_UNSPECIFIED
      - UNIVERSE_STATE_LIVE
      - UNIVERSE_STATE_IDLE
      - UNIVERSE_STATE_FAILING
      type: string
    dmx.universe.v1.UpdateLevelsRequest:
      description: 'Request message for UniverseService.UpdateLevels: every slot at
        once.'
      properties:
        levels:
          description: The levels to send. Their name identifies the output universe,
            and the slots' count becomes how many are sent.
          properties:
            generation:
              description: A counter that moves exactly when the levels a receiver
                would see change, so a reader polling can tell a change from a repeat.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
            name:
              description: 'The levels'' name. Format: universes/{universe}/levels'
              type: string
            slots:
              description: 'The slots, one octet each, from slot 1: 0 to 512 of them.
                Their count is how many slots are sent.'
              format: byte
              type: string
            updateTime:
              description: When they last changed.
              format: date-time
              type: string
          type: object
        updateMask:
          description: Only `slots` may be written.
          properties:
            paths:
              description: The set of field mask paths.
              items:
                type: string
              type: array
          type: object
      type: object
    dmx.universe.v1.UpdateUniverseRequest:
      description: Request message for UniverseService.UpdateUniverse.
      properties:
        universe:
          description: The universe to update. Its name field identifies which.
          properties:
            createTime:
              description: When it was created.
              format: date-time
              type: string
            displayName:
              description: A label for people.
              type: string
            input:
              description: Received, and merged.
              properties:
                maxSources:
                  description: The most sources merged at once; more are refused.
                    Defaults to 8.
                  format: int32
                  type: integer
                mergeMode:
                  description: HTP or LTP, among the sources at the highest priority
                    present.
                  enum:
                  - MERGE_MODE_UNSPECIFIED
                  - MERGE_MODE_HTP
                  - MERGE_MODE_LTP
                  type: string
                sources:
                  description: The sources merged now.
                  items:
