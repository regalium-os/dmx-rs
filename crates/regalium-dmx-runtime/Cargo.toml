[package]
name = "regalium-dmx-runtime"
description = "Runtime for the Regalium DMX driver: one output thread per transport, refresh on an injected clock, events, and later sources, merging and RDM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Plain std, no async executor, as bacnet-rs's runtime: each output path owns
# its thread and its timing rather than sharing an executor with whatever
# else the caller runs, where a busy task would delay someone's refresh.
[dependencies]
regalium-dmx-core.workspace = true
regalium-dmx-telemetry.workspace = true

# The live tests drive a real transport end to end on loopback.
[dev-dependencies]
regalium-dmx-artnet.workspace = true
regalium-dmx-sacn.workspace = true

[lints]
workspace = true
